[package]
name = "broadcast-pane"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "Type in a small popup and your keystrokes go to all (or chosen) panes of the tab, much like tmux's synchronize-panes"
license = "MIT"
repository = "https://github.com/abroller666/broadcast-pane"
publish = false

[dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
